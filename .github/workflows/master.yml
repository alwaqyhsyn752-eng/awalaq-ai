name: Master Node
on:
  repository_dispatch:
    types: [user_request]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract payload
        id: p
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          node -e '
            const p = JSON.parse(process.env.PAYLOAD || "{}");
            const fs = require("fs");
            const job = p.job_id || ("m-" + Date.now());
            const msgs = p.messages || [];
            const last = msgs.filter(m => m.role === "user").pop() || {content: "مرحباً"};
            fs.writeFileSync("job.json", JSON.stringify({job_id: job, messages: msgs, prompt: String(last.content || "").slice(0, 8000)}, null, 2));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "job_id=" + job + "\n");
          '

      - name: Dispatch Logic
        env:
          PAT: ${{ secrets.CROSS_REPO_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          BODY=$(node -e 'const j=require("./job.json");console.log(JSON.stringify({event_type:"analyze",client_payload:{job_id:j.job_id,prompt:j.prompt,history:j.messages.slice(-8)}}));')
          curl -sS -X POST -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$OWNER/awalaq-logic/dispatches" -d "$BODY"

      - name: Dispatch CodeGen
        env:
          PAT: ${{ secrets.CROSS_REPO_PAT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          BODY=$(node -e 'const j=require("./job.json");console.log(JSON.stringify({event_type:"generate",client_payload:{job_id:j.job_id,prompt:j.prompt,history:j.messages.slice(-8)}}));')
          curl -sS -X POST -H "Authorization: Bearer $PAT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$OWNER/awalaq-codegen/dispatches" -d "$BODY"

      - name: Wait for nodes
        env:
          PAT: ${{ secrets.CROSS_REPO_PAT }}
          OWNER: ${{ github.repository_owner }}
          JOB: ${{ steps.p.outputs.job_id }}
        run: |
          for i in {1..40}; do
            L=$(curl -s -H "Authorization: Bearer $PAT" "https://raw.githubusercontent.com/$OWNER/awalaq-logic/main/out/$JOB.json")
            C=$(curl -s -H "Authorization: Bearer $PAT" "https://raw.githubusercontent.com/$OWNER/awalaq-codegen/main/out/$JOB.json")
            if [[ "$L" == *"job_id"* ]] && [[ "$C" == *"job_id"* ]]; then
              echo "$L" > logic.json
              echo "$C" > codegen.json
              echo "النتائج جاهزة!"
              exit 0
            fi
            echo "بانتظار الوكلاء... المحاولة $i"
            sleep 5
          done
          echo "انتهت المهلة"
          exit 1

      - name: Merge
        env:
          JOB: ${{ steps.p.outputs.job_id }}
        run: |
          mkdir -p results
          node -e '
            const fs=require("fs");const job=process.env.JOB;
            const L=JSON.parse(fs.readFileSync("logic.json","utf8"));
            const C=JSON.parse(fs.readFileSync("codegen.json","utf8"));
            const ans=[C.answer||"","","---","**تحليل المنطق:** "+(L.summary||"—"),
              L.risks?.length?"**مخاطر:** "+L.risks.join(" · "):"",
              "**النمط:** `"+(L.intent||"general")+"`"].filter(Boolean).join("\n");
            fs.writeFileSync("results/"+job+".json",JSON.stringify({job_id:job,answer:ans,nodes:{logic:L.model||"rules",codegen:C.model||"rules"},meta:{logic:L,codegen:C,ts:new Date().toISOString()}},null,2));
          '

      - name: Commit
        run: |
          git config user.name "awalaq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add results/
          git commit -m "result: ${{ steps.p.outputs.job_id }}" || echo "لا يوجد شيء"
          git push
